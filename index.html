<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私人雲端驗證</title>
  <style>
    body { background-color: #0f172a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .box { background: #1e293b; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 90%; max-width: 350px; }
    input { padding: 12px; font-size: 16px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-bottom: 15px; width: 100%; box-sizing: border-box; }
    button { padding: 12px 20px; background: #0284c7; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; width: 100%; font-weight: bold; }
    button:hover { background: #0369a1; }
  </style>
</head>
<body>
  <div class="box" id="loginBox">
    <h3>🔒 請輸入您的專屬安全密碼</h3>
    <input type="password" id="pwd" placeholder="輸入密碼">
    <br>
    <button onclick="checkPassword()">進入系統</button>
  </div>

  <div id="content" style="display:none; width:100%; height:100vh;">
    <!-- 正確指向官方網頁控制台 -->
    <iframe src="https://rustdesk.com/web" style="width:100%; height:100%; border:none;"></iframe>
  </div>

  <script>
    function checkPassword() {
      var userPassword = document.getElementById('pwd').value;
      // 這裡的 '123456' 是密碼，你可以隨時在代碼裡改成你自己想要的密碼！
      if (userPassword === '123456') {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      } else {
        alert('密碼錯誤！');
      }
    }
  </script>
</body>
</html>
