<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox 浣貓工作室 🐾 官方夢幻商城</title>
  <style>
    :root {
      --primary-pink: #ff75a0;
      --primary-blue: #6c5ce7;
      --candy-yellow: #feca57;
      --candy-cyan: #48dbfb;
      --bg-light: #f7f9fc;
      --text-dark: #2f3542;
      --text-sub: #747d8c;
      --discord-color: #5865F2;
      --rainbow-bar: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #54a0ff, #5f27cd, #ff6b6b);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-light);
      background-image: 
        radial-gradient(circle at 10% 15%, rgba(255, 117, 160, 0.18) 0%, transparent 40%),
        radial-gradient(circle at 90% 85%, rgba(108, 92, 231, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(72, 219, 251, 0.12) 0%, transparent 60%);
      color: var(--text-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
      min-height: 100vh;
      padding-bottom: 120px;
      overflow-x: hidden;
    }

    /* 頂部彩虹動畫流光條 */
    .rainbow-strip {
      height: 6px;
      width: 100%;
      background: var(--rainbow-bar);
      background-size: 300% 100%;
      animation: rainbowFlow 4s linear infinite;
    }
    @keyframes rainbowFlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    /* 頂部可愛浣貓吉祥物看板 */
    header {
      text-align: center;
      padding: 35px 20px 20px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid rgba(255, 117, 160, 0.2);
      position: relative;
    }

    /* 可愛流淚小浣貓吉祥物 (純 CSS + 互動彩蛋) */
    .mascot-wrap {
      display: inline-block;
      cursor: pointer;
      position: relative;
      animation: bounceMascot 3s ease-in-out infinite;
    }
    @keyframes bounceMascot {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .mascot-avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a4b0be, #747d8c);
      margin: 0 auto;
      border: 4px solid #ffffff;
      box-shadow: 0 10px 25px rgba(255, 117, 160, 0.35);
      position: relative;
      overflow: hidden;
    }
    /* 耳朵 */
    .ear {
      position: absolute;
      width: 32px;
      height: 32px;
      background: #57606f;
      border-radius: 50% 50% 0 0;
      top: -8px;
      border: 3px solid #fff;
    }
    .ear.left { left: 4px; transform: rotate(-25deg); }
    .ear.right { right: 4px; transform: rotate(25deg); }
    /* 浣熊黑眼眶面罩 */
    .eye-mask {
      position: absolute;
      width: 80px;
      height: 32px;
      background: #2f3542;
      border-radius: 20px;
      top: 36px;
      left: 8px;
    }
    .mascot-eye {
      width: 10px;
      height: 14px;
      background: #ffffff;
      border-radius: 50%;
      position: absolute;
      top: 9px;
      animation: blinkEyes 4s infinite;
    }
    .mascot-eye.left { left: 16px; }
    .mascot-eye.right { right: 16px; }
    @keyframes blinkEyes {
      0%, 96%, 100% { transform: scaleY(1); }
      98% { transform: scaleY(0.1); }
    }
    /* 可愛淚滴（呼應工作室頭像特徵） */
    .tear {
      position: absolute;
      width: 6px;
      height: 9px;
      background: #48dbfb;
      border-radius: 0 50% 50% 50%;
      transform: rotate(45deg);
      top: 25px;
      animation: dripTear 2s infinite ease-in;
    }
    .tear.left { left: 18px; }
    .tear.right { right: 18px; }
    @keyframes dripTear {
      0% { opacity: 0; transform: translateY(-2px) rotate(45deg); }
      50% { opacity: 1; }
      100% { opacity: 0; transform: translateY(12px) rotate(45deg); }
    }
    .snout {
      position: absolute;
      width: 26px;
      height: 18px;
      background: #ffffff;
      border-radius: 50%;
      bottom: 12px;
      left: 35px;
      z-index: 2;
    }
    .nose {
      width: 8px;
      height: 6px;
      background: #2f3542;
      border-radius: 50%;
      margin: 3px auto 0;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 900;
      margin-top: 12px;
      background: linear-gradient(135deg, #ff4757, #6c5ce7, #00d2d3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }
    .brand-sub {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 5px;
      font-weight: 600;
    }

    /* 分類標籤導覽 (趣味糖果按鈕) */
    .tab-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      position: sticky;
      top: 0;
      background: rgba(247, 249, 252, 0.9);
      backdrop-filter: blur(16px);
      z-index: 10;
    }
    .tab-btn {
      background: #ffffff;
      border: 2px solid #e4e7eb;
      color: var(--text-sub);
      padding: 9px 20px;
      border-radius: 25px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .tab-btn.active, .tab-btn:hover {
      background: linear-gradient(135deg, #ff75a0, #ff8993);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 6px 18px rgba(255, 117, 160, 0.4);
      transform: translateY(-3px);
    }

    /* 主要容器 */
    .container {
      max-width: 1050px;
      margin: 0 auto;
      padding: 20px;
    }
    .section-title {
      font-size: 20px;
      font-weight: 900;
      margin: 30px 0 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title span {
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: #ffffff;
      font-size: 12px;
      padding: 3px 12px;
      border-radius: 12px;
      font-weight: 700;
    }

    /* 卡片網格與動漫明亮風商品卡 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.92);
      border: 2px solid #ffffff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 24px rgba(180, 195, 215, 0.2);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 36px rgba(255, 117, 160, 0.25);
      border-color: rgba(255, 117, 160, 0.4);
    }
    .card-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 12px;
      background: #ffeef2;
      color: #ff4757;
      margin-bottom: 10px;
      width: fit-content;
    }
    .card-badge.account { background: #eef2ff; color: #5352ed; }
    .card-badge.service { background: #eafaf1; color: #2ed573; }
    .card h3 {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #2f3542;
      line-height: 1.4;
    }
    .card p {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 16px;
      min-height: 40px;
    }
    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
      border-top: 1px dashed rgba(0, 0, 0, 0.08);
    }
    .price-box {
      font-size: 20px;
      font-weight: 900;
      color: #ff4757;
    }
    .add-btn {
      background: linear-gradient(135deg, #6c5ce7, #5865F2);
      color: #fff;
      border: none;
      padding: 9px 18px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
      transition: all 0.2s;
    }
    .add-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 16px rgba(88, 101, 242, 0.4);
    }

    /* 懸浮購物車浮動按鈕 */
    .cart-float {
      position: fixed;
      right: 24px;
      bottom: 24px;
      background: linear-gradient(135deg, #ff75a0, #ff8993);
      color: #ffffff;
      padding: 14px 24px;
      border-radius: 40px;
      font-weight: 900;
      font-size: 15px;
      box-shadow: 0 10px 25px rgba(255, 117, 160, 0.45);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .cart-float:hover {
      transform: scale(1.08);
    }
    .cart-num {
      background: #ffffff;
      color: #ff4757;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 900;
    }

    /* 購物車抽屜 (亮色玻璃質感) */
    .cart-drawer {
      position: fixed;
      top: 0;
      right: -100%;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(20px);
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.15);
      z-index: 200;
      display: flex;
      flex-direction: column;
      transition: right 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .cart-drawer.active { right: 0; }
    .cart-header {
      padding: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f1f2f6;
    }
    .cart-header h3 { font-size: 18px; font-weight: 900; color: #2f3542; }
    .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #a4b0be; }
    .cart-body {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }
    .cart-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8faff;
      border: 1.5px solid #edf2f7;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 12px;
    }
    .item-title { font-size: 13px; font-weight: 800; color: #2f3542; max-width: 220px; }
    .item-price { font-size: 14px; font-weight: 900; color: #ff4757; }
    .item-del { color: #ff6b81; border: none; background: none; cursor: pointer; font-size: 16px; margin-left: 8px; }

    .cart-footer {
      padding: 22px;
      border-top: 2px solid #f1f2f6;
      background: #ffffff;
    }
    .warranty-card {
      background: #fff0f3;
      border: 1.5px solid #ffd1dc;
      padding: 10px 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
      color: #ff4757;
      margin-bottom: 16px;
      cursor: pointer;
    }
    .total-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: 900;
      color: #2f3542;
      margin-bottom: 16px;
    }
    .total-box span:last-child {
      font-size: 22px;
      color: #ff4757;
    }
    .checkout-btn {
      width: 100%;
      background: linear-gradient(135deg, #5865F2, #6c5ce7);
      color: #ffffff;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(88, 101, 242, 0.35);
      transition: all 0.2s;
    }
    .checkout-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(88, 101, 242, 0.45);
    }
    .mask {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(47, 53, 66, 0.35);
      backdrop-filter: blur(4px);
      z-index: 150;
      display: none;
    }
    .mask.active { display: block; }
  </style>
</head>
<body>

  <!-- 彩虹炫彩動態頂條 -->
  <div class="rainbow-strip"></div>

  <!-- 頂部 Header & 可愛浣貓吉祥物 -->
  <header>
    <div class="mascot-wrap" onclick="mascotCheer()">
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="mascot-avatar">
        <div class="eye-mask">
          <div class="mascot-eye left"></div>
          <div class="mascot-eye right"></div>
          <div class="tear left"></div>
          <div class="tear right"></div>
        </div>
        <div class="snout">
          <div class="nose"></div>
        </div>
      </div>
    </div>
    <h1 class="brand-title">Roblox 浣貓工作室 🐾</h1>
    <p class="brand-sub">✨ 頂尖通用腳本 ｜ Blox Fruits 滿等全V4帳號 ｜ 專業客製代找 ✨</p>
  </header>

  <!-- 糖果分類標籤列 -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchCategory('all', this)">全部商品 ✨</button>
    <button class="tab-btn" onclick="switchCategory('script', this)">通用腳本 ⚡</button>
    <button class="tab-btn" onclick="switchCategory('account', this)">Blox Fruits 帳號 ⚔️</button>
    <button class="tab-btn" onclick="switchCategory('service', this)">客製代找 🔍</button>
  </div>

  <div class="container">
    <!-- 通用腳本區 -->
    <div id="box-script">
      <div class="section-title">通用腳本授權專區 <span>多款遊戲通用</span></div>
      <div class="grid" id="list-script"></div>
    </div>

    <!-- Blox Fruits 帳號專區 -->
    <div id="box-account">
      <div class="section-title">Blox Fruits 帳號現貨專區 <span>滿等 2800Lv / 全V4滿齒</span></div>
      <div class="grid" id="list-account"></div>
    </div>

    <!-- 客製代找服務區 -->
    <div id="box-service">
      <div class="section-title">客製代找與解鎖服務 <span>任何遊戲皆可</span></div>
      <div class="grid" id="list-service"></div>
    </div>
  </div>

  <!-- 懸浮購物車 -->
  <div class="cart-float" onclick="openCart()">
    🛒 我的清單
    <span class="cart-num" id="badge-count">0</span>
  </div>

  <!-- 購物車遮罩與抽屜 -->
  <div class="mask" id="cart-mask" onclick="closeCart()"></div>
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h3>🐾 浣貓採購清單</h3>
      <button class="close-btn" onclick="closeCart()">&times;</button>
    </div>
    <div class="cart-body" id="cart-items">
      <p style="text-align: center; color: #a4b0be; margin-top: 40px; font-size: 14px;">目前還沒有加入任何商品喔！</p>
    </div>
    <div class="cart-footer">
      <label class="warranty-card">
        <input type="checkbox" id="warranty-opt" onchange="renderCart()">
        🛡️ 加購 7 天售後保障 (+NT$ 50)
      </label>
      <div class="total-box">
        <span>合計金額</span>
        <span id="total-price">NT$ 0</span>
      </div>
      <button class="checkout-btn" onclick="copyAndCheckout()">
        📋 複製訂單並前往 Discord 結單
      </button>
    </div>
  </div>

  <script>
    // 完整商品資料庫（完整涵蓋你交代的所有商品）
    const scriptItems = [
      { id: 's1', name: 'Banana Cat Hub Premium 永久專屬密鑰', price: 600, desc: '官方授權永久專屬金鑰，自動穩定更新。' },
      { id: 's2', name: 'Maru Hub Premium 永久鑰匙', price: 500, desc: '極簡科技藍白風格介面，高效率運行。' },
      { id: 's3', name: 'HoHo Hub 永久鑰匙', price: 600, desc: '老牌熱門 Hub，功能完整多樣化。' },
      { id: 's4', name: 'SPEED Hub X Premium 永久鑰匙', price: 400, desc: '極速執行性能，專屬暗黑戰鬥面板。' },
      { id: 's5', name: 'RIVALS UE 永久鑰匙 (Unnamed Enhancements)', price: 1000, desc: '頂級效能強化，自瞄與對戰輔助。' },
      { id: 's6', name: 'RIVALS KiciaHook 永久鑰匙 (KiciaHook V3)', price: 1100, desc: 'Aimbot & ESP 頂尖功能，Undetected 終身防護更新。' }
    ];

    const accountItems = [
      { id: 'a1', name: '1 號：2800Lv + 神人', price: 100, desc: '滿等基礎帳號，起步快速成型。' },
      { id: 'a2', name: '2 號：2800Lv + 神人 + 血拳', price: 200, desc: '滿等具備血拳拳法。' },
      { id: 'a3', name: '3 號：2800Lv + 神人 + 天使V4 + 雙刀 + 吉他', price: 350, desc: '滿等天使V4高階神裝配置。' },
      { id: 'a4', name: '4 號：2800Lv + 神人 + 人類V4 + 雙刀 + 吉他', price: 350, desc: '滿等人類V4極限爆發輸出。' },
      { id: 'a5', name: '5 號：2800Lv + 神人 + 兔子V4 + 雙刀 + 吉他', price: 350, desc: '滿等兔子V4高速機動連招。' },
      { id: 'a6', name: '6 號：2800Lv + 神人 + 機器人V4 + 雙刀 + 吉他', price: 350, desc: '滿等機器人V4防禦壓制。' },
      { id: 'a7', name: '7 號：2800Lv + 神人 + 吸血鬼V4 + 雙刀 + 吉他', price: 350, desc: '滿等吸血鬼V4回血續航。' },
      { id: 'a8', name: '8 號：2800Lv + 神人 + 漁人V4 + 雙刀 + 吉他', price: 350, desc: '滿等漁人V4水戰抗性全滿。' },
      { id: 'a9', name: '9 號：2800Lv + 血拳 + 龍族V4 + 雙刀 + 吉他 + 龍槍 + 龍刀', price: 650, desc: '全套龍武裝＋龍族V4豪華套裝。' },
      { id: 'a10', name: '10 號：2800Lv + 七大種族V4(滿齒) + 雙刀 + 吉他 + 龍刀 + 龍槍 + 神人 + 血拳', price: 1500, desc: '天花板畢業神號！七大種族V4滿齒全制霸。' },
      { id: 'a11', name: '11 號：2800Lv + 神人 + 六大種族滿尺(無龍族) + 雙刀 + 吉他', price: 800, desc: '全六大常規種族滿齒畢業號。' },
      { id: 'a12', name: '12 號：2800Lv + 神人 + 雙刀 + 吉他', price: 200, desc: '基礎雙刀吉他平民高性價比號。' },
      { id: 'a13', name: '13 號：2800Lv + 血拳 + 雙刀 + 吉他', price: 250, desc: '帶血拳與主力神兵現貨。' }
    ];

    const serviceItems = [
      { id: 'sv1', name: '代找腳本服務（任何遊戲皆可）', price: 200, desc: '專業管道代尋各類特定遊戲腳本。' },
      { id: 'sv2', name: '幫忙解鎖鑰匙加購服務', price: 50, desc: '免繁瑣驗證，代解各類腳本通行鑰匙。' }
    ];

    let cart = [];

    // 渲染商品到頁面
    function fillCards(items, elId, badgeClass, badgeLabel) {
      const el = document.getElementById(elId);
      el.innerHTML = items.map(item => `
        <div class="card">
          <div>
            <span class="card-badge ${badgeClass}">${badgeLabel}</span>
            <h3>${item.name}</h3>
            <p>${item.desc}</p>
          </div>
          <div class="card-bottom">
            <span class="price-box">NT$ ${item.price}</span>
            <button class="add-btn" onclick="addToCart('${item.id}', '${item.name}', ${item.price})">+ 加入清單</button>
          </div>
        </div>
      `).join('');
    }

    fillCards(scriptItems, 'list-script', '', '通用腳本');
    fillCards(accountItems, 'list-account', 'account', 'Blox Fruits 帳號');
    fillCards(serviceItems, 'list-service', 'service', '客製服務');

    // 趣味彩蛋：點擊浣貓會眨眼並打招呼
    function mascotCheer() {
      alert("🐾 浣貓老闆：「感謝光臨 Roblox 浣貓工作室！點擊商品就可以加入清單結帳唷～」");
    }

    // 購物車互動
    function addToCart(id, name, price) {
      cart.push({ id, name, price });
      renderCart();
      openCart();
    }

    function removeItem(index) {
      cart.splice(index, 1);
      renderCart();
    }

    function openCart() {
      document.getElementById('cart-drawer').classList.add('active');
      document.getElementById('cart-mask').classList.add('active');
    }

    function closeCart() {
      document.getElementById('cart-drawer').classList.remove('active');
      document.getElementById('cart-mask').classList.remove('active');
    }

    function renderCart() {
      const container = document.getElementById('cart-items');
      const badge = document.getElementById('badge-count');
      const totalTxt = document.getElementById('total-price');
      const hasWarranty = document.getElementById('warranty-opt').checked;

      badge.textContent = cart.length;

      if (cart.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #a4b0be; margin-top: 40px; font-size: 14px;">目前還沒有加入任何商品喔！</p>';
        totalTxt.textContent = 'NT$ 0';
        return;
      }

      let subtotal = cart.reduce((sum, item) => sum + item.price, 0);
      let finalTotal = subtotal + (hasWarranty ? 50 : 0);

      container.innerHTML = cart.map((item, idx) => `
        <div class="cart-item-row">
          <div>
            <div class="item-title">${item.name}</div>
            <div class="item-price">NT$ ${item.price}</div>
          </div>
          <button class="item-del" onclick="removeItem(${idx})">✕</button>
        </div>
      `).join('');

      totalTxt.textContent = `NT$ ${finalTotal}`;
    }

    // 複製訂單並導向 Discord
    function copyAndCheckout() {
      if (cart.length === 0) {
        alert('購物清單裡面還沒有任何商品喔！');
        return;
      }

      const hasWarranty = document.getElementById('warranty-opt').checked;
      let subtotal = cart.reduce((sum, item) => sum + item.price, 0);
      let finalTotal = subtotal + (hasWarranty ? 50 : 0);

      let orderText = `🐾 【Roblox 浣貓工作室】線上訂單 🐾\\n`;
      orderText += `---------------------------------------\\n`;
      cart.forEach((item, index) => {
        orderText += `${index + 1}. ${item.name} ➔ NT$ ${item.price}\\n`;
      });
      if (hasWarranty) {
        orderText += `★ 加購售後：7 天售後保障 (+NT$ 50)\\n`;
      }
      orderText += `---------------------------------------\\n`;
      orderText += `💰 總結算金額：NT$ ${finalTotal}\\n`;
      orderText += `老闆您好！我已在官網挑選好以上商品，想進行購買結單～`;

      navigator.clipboard.writeText(orderText).then(() => {
        alert('🎉 訂單內容已複製到剪貼簿！即將帶您前往 Discord 伺服器發送結單訊息～');
        window.open('https://discord.gg/wdrpVxyjTe', '_blank');
      }).catch(() => {
        window.open('https://discord.gg/wdrpVxyjTe', '_blank');
      });
    }

    // 分類導覽切換
    function switchCategory(cat, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      document.getElementById('box-script').style.display = (cat === 'all' || cat === 'script') ? 'block' : 'none';
      document.getElementById('box-account').style.display = (cat === 'all' || cat === 'account') ? 'block' : 'none';
      document.getElementById('box-service').style.display = (cat === 'all' || cat === 'service') ? 'block' : 'none';
    }
  </script>
</body>
</html>
