<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox 浣貓工作室 | 官方線上商城</title>
  <style>
    :root {
      --bg-base: #0c0e14;
      --bg-card: #151821;
      --bg-card-hover: #1b202c;
      --accent-discord: #5865F2;
      --accent-rainbow: linear-gradient(135deg, #ff007f, #7928ca, #0070f3, #00dfd8, #7928ca);
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --price-color: #00e699;
      --border-color: #262c3a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      padding-bottom: 90px;
    }

    /* 頂部彩虹動態光條 */
    .rainbow-bar {
      height: 4px;
      width: 100%;
      background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff0000);
      background-size: 300% 100%;
      animation: rainbowMove 5s linear infinite;
    }

    @keyframes rainbowMove {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    /* 橫幅頂部 Header */
    header {
      padding: 30px 20px 20px;
      text-align: center;
      background: radial-gradient(circle at top, rgba(88, 101, 242, 0.25) 0%, transparent 70%);
      border-bottom: 1px solid var(--border-color);
    }
    .brand-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ffffff, #85a5ff, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .brand-subtitle {
      font-size: 13px;
      color: var(--text-sub);
    }

    /* 分類導覽標籤 */
    .category-nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      background: rgba(12, 14, 20, 0.9);
      backdrop-filter: blur(10px);
      z-index: 10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .tab-btn {
      background: #1c202d;
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active, .tab-btn:hover {
      background: var(--accent-discord);
      color: #fff;
      border-color: var(--accent-discord);
      box-shadow: 0 0 12px rgba(88, 101, 242, 0.5);
    }

    /* 主要容器 */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    .section-title {
      font-size: 19px;
      font-weight: 800;
      margin: 24px 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::before {
      content: "";
      width: 4px;
      height: 18px;
      background: var(--accent-discord);
      border-radius: 2px;
    }

    /* 卡片網格 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(88, 101, 242, 0.4);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .card-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(88, 101, 242, 0.15);
      color: #85a5ff;
      margin-bottom: 10px;
      width: fit-content;
    }
    .card h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .card p {
      font-size: 12.5px;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 16px;
      min-height: 38px;
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .price-tag {
      font-size: 17px;
      font-weight: 800;
      color: var(--price-color);
    }
    .add-cart-btn {
      background: #232938;
      border: 1px solid #333d52;
      color: #fff;
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .add-cart-btn:hover {
      background: var(--accent-discord);
      border-color: var(--accent-discord);
    }

    /* 懸浮購物車浮動按鈕 */
    .cart-float-btn {
      position: fixed;
      right: 20px;
      bottom: 24px;
      background: linear-gradient(135deg, #5865F2, #7289da);
      color: #fff;
      padding: 12px 20px;
      border-radius: 30px;
      box-shadow: 0 8px 24px rgba(88, 101, 242, 0.4);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      z-index: 100;
      transition: transform 0.2s;
    }
    .cart-float-btn:hover {
      transform: scale(1.05);
    }
    .cart-count-badge {
      background: #ff4757;
      color: #fff;
      padding: 2px 7px;
      border-radius: 12px;
      font-size: 11px;
    }

    /* 購物車側欄抽屜 */
    .cart-modal {
      position: fixed;
      top: 0;
      right: -100%;
      width: 100%;
      max-width: 400px;
      height: 100vh;
      background: #141720;
      border-left: 1px solid var(--border-color);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.7);
      z-index: 200;
      display: flex;
      flex-direction: column;
      transition: right 0.3s ease;
    }
    .cart-modal.active {
      right: 0;
    }
    .cart-header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }
    .cart-close-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 20px;
      cursor: pointer;
    }
    .cart-items-container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #1b202c;
      border-radius: 12px;
      margin-bottom: 10px;
      border: 1px solid #262c3b;
    }
    .cart-item-name {
      font-size: 13px;
      font-weight: 700;
      max-width: 200px;
    }
    .cart-item-price {
      font-size: 13px;
      color: var(--price-color);
      font-weight: 700;
    }
    .cart-item-del {
      background: none;
      border: none;
      color: #ff5252;
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
    }
    .cart-footer {
      padding: 20px;
      border-top: 1px solid var(--border-color);
      background: #11141c;
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .checkout-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: linear-gradient(135deg, #5865F2, #7289da);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(88, 101, 242, 0.4);
    }
    .backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.6);
      z-index: 150;
      display: none;
    }
    .backdrop.active {
      display: block;
    }

    /* 附加保障勾選框 */
    .warranty-box {
      margin-bottom: 12px;
      padding: 10px;
      background: #1a1e29;
      border-radius: 8px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 彩虹炫光頂條 -->
  <div class="rainbow-bar"></div>

  <!-- 頂部 Studio 資訊 -->
  <header>
    <div class="brand-title">Roblox 浣貓工作室</div>
    <div class="brand-subtitle">腳本授權專區 ｜ Blox Fruits 滿等與全V4帳號 ｜ 代找腳本服務</div>
  </header>

  <!-- 分類篩選導覽 -->
  <div class="category-nav">
    <button class="tab-btn active" onclick="filterCategory('all', this)">全部商品</button>
    <button class="tab-btn" onclick="filterCategory('script', this)">通用腳本</button>
    <button class="tab-btn" onclick="filterCategory('account', this)">Blox Fruits 帳號</button>
    <button class="tab-btn" onclick="filterCategory('service', this)">客製代找</button>
  </div>

  <div class="container">
    <!-- 通用腳本區 -->
    <div class="category-section" id="sec-script">
      <div class="section-title">通用腳本授權（多款遊戲通用）</div>
      <div class="grid" id="script-list"></div>
    </div>

    <!-- Blox Fruits 帳號區 -->
    <div class="category-section" id="sec-account">
      <div class="section-title">Blox Fruits 帳號代練 / 現貨專區</div>
      <div class="grid" id="account-list"></div>
    </div>

    <!-- 客製代找服務區 -->
    <div class="category-section" id="sec-service">
      <div class="section-title">代找腳本與鑰匙解鎖服務</div>
      <div class="grid" id="service-list"></div>
    </div>
  </div>

  <!-- 浮動購物車按鈕 -->
  <div class="cart-float-btn" onclick="toggleCart()">
    🛒 購物車結帳
    <span class="cart-count-badge" id="cart-count">0</span>
  </div>

  <!-- 購物車抽屜與遮罩 -->
  <div class="backdrop" id="backdrop" onclick="toggleCart()"></div>
  <div class="cart-modal" id="cart-modal">
    <div class="cart-header">
      <h3>我的採購清單</h3>
      <button class="cart-close-btn" onclick="toggleCart()">&times;</button>
    </div>
    <div class="cart-items-container" id="cart-items">
      <p style="color: #6c757d; font-size: 13px; text-align: center; margin-top: 30px;">購物車空空如也</p>
    </div>
    <div class="cart-footer">
      <label class="warranty-box">
        <input type="checkbox" id="warranty-check" onchange="renderCart()">
        加購 7 天售後保障 (+NT$ 50)
      </label>
      <div class="total-row">
        <span>合計金額</span>
        <span style="color: var(--price-color);" id="cart-total">NT$ 0</span>
      </div>
      <button class="checkout-btn" onclick="copyAndGoDiscord()">
        複製訂單內容並前往 Discord 結單
      </button>
    </div>
  </div>

  <script>
    // 1. 商品資料清單
    const scripts = [
      { id: 's1', name: 'Banana Cat Hub Premium 永久專屬密鑰', price: 600, desc: '官方授權永久專屬金鑰，自動穩定更新。' },
      { id: 's2', name: 'Maru Hub Premium 永久鑰匙', price: 500, desc: '極簡科技藍白風格介面，高效率掛機運行。' },
      { id: 's3', name: 'HoHo Hub 永久鑰匙', price: 600, desc: '老牌熱門 Hub，功能完整多樣化。' },
      { id: 's4', name: 'SPEED Hub X Premium 永久鑰匙', price: 400, desc: '極速執行性能，專屬暗黑戰鬥面板。' },
      { id: 's5', name: 'RIVALS UE 永久鑰匙 (Unnamed Enhancements)', price: 1000, desc: '頂級效能強化，自瞄與對戰輔助。' },
      { id: 's6', name: 'RIVALS KiciaHook 永久鑰匙 (KiciaHook V3)', price: 1100, desc: 'Aimbot & ESP 頂尖功能，Undetected 終身防護更新。' }
    ];

    const accounts = [
      { id: 'a1', name: '1 號：2800Lv + 神人', price: 100, desc: '滿等基礎帳號，起步快速成型。' },
      { id: 'a2', name: '2 號：2800Lv + 神人 + 血拳', price: 200, desc: '滿等具備血拳拳法。' },
      { id: 'a3', name: '3 號：2800Lv + 神人 + 天使V4 + 雙刀 + 吉他', price: 350, desc: '滿等天使V4高階神裝配置。' },
      { id: 'a4', name: '4 號：2800Lv + 神人 + 人類V4 + 雙刀 + 吉他', price: 350, desc: '滿等人類V4極限爆發輸出。' },
      { id: 'a5', name: '5 號：2800Lv + 神人 + 兔子V4 + 雙刀 + 吉他', price: 350, desc: '滿等兔子V4高速機動連招。' },
      { id: 'a6', name: '6 號：2800Lv + 神人 + 機器人V4 + 雙刀 + 吉他', price: 350, desc: '滿等機器人V4防禦壓制。' },
      { id: 'a7', name: '7 號：2800Lv + 神人 + 吸血鬼V4 + 雙刀 + 吉他', price: 350, desc: '滿等吸血鬼V4回血續航。' },
      { id: 'a8', name: '8 號：2800Lv + 神人 + 漁人V4 + 雙刀 + 吉他', price: 350, desc: '滿等漁人V4水戰抗性全滿。' },
      { id: 'a9', name: '9 號：2800Lv + 血拳 + 龍族V4 + 雙刀 + 吉他 + 龍槍 + 龍刀', price: 650, desc: '全套龍武裝＋龍族V4豪華套裝。' },
      { id: 'a10', name: '10 號：2800Lv + 七大種族V4(滿齒) + 雙刀 + 吉他 + 龍刀 + 龍槍 + 神人 + 血拳', price: 1500, desc: '天花板畢業神號！七大種族V4滿齒全制霸。' },
      { id: 'a11', name: '11 號：2800Lv + 神人 + 六大種族滿尺(無龍族) + 雙刀 + 吉他', price: 800, desc: '全六大常規種族滿齒畢業號。' },
      { id: 'a12', name: '12 號：2800Lv + 神人 + 雙刀 + 吉他', price: 200, desc: '基礎雙刀吉他平民高性價比號。' },
      { id: 'a13', name: '13 號：2800Lv + 血拳 + 雙刀 + 吉他', price: 250, desc: '帶血拳與主力神兵現貨。' }
    ];

    const services = [
      { id: 'sv1', name: '代找腳本服務（任何遊戲皆可）', price: 200, desc: '專業管道代尋各類特定遊戲腳本。' },
      { id: 'sv2', name: '幫忙解鎖鑰匙加購服務', price: 50, desc: '免繁瑣驗證，代解各類腳本通行鑰匙。' }
    ];

    let cart = [];

    // 2. 渲染商品清單
    function renderSection(items, containerId, badgeText) {
      const container = document.getElementById(containerId);
      container.innerHTML = items.map(item => `
        <div class="card">
          <div>
            <span class="card-badge">${badgeText}</span>
            <h3>${item.name}</h3>
            <p>${item.desc}</p>
          </div>
          <div class="card-footer">
            <span class="price-tag">NT$ ${item.price}</span>
            <button class="add-cart-btn" onclick="addToCart('${item.id}', '${item.name}', ${item.price})">+ 加入清單</button>
          </div>
        </div>
      `).join('');
    }

    renderSection(scripts, 'script-list', '通用腳本');
    renderSection(accounts, 'account-list', 'Blox Fruits 帳號');
    renderSection(services, 'service-list', '客製服務');

    // 3. 購物車邏輯
    function addToCart(id, name, price) {
      cart.push({ id, name, price });
      renderCart();
      toggleCart(true);
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      renderCart();
    }

    function toggleCart(forceOpen = null) {
      const modal = document.getElementById('cart-modal');
      const backdrop = document.getElementById('backdrop');
      if (forceOpen === true) {
        modal.classList.add('active');
        backdrop.classList.add('active');
      } else if (forceOpen === false) {
        modal.classList.remove('active');
        backdrop.classList.remove('active');
      } else {
        modal.classList.toggle('active');
        backdrop.classList.toggle('active');
      }
    }

    function renderCart() {
      const listEl = document.getElementById('cart-items');
      const countEl = document.getElementById('cart-count');
      const totalEl = document.getElementById('cart-total');
      const hasWarranty = document.getElementById('warranty-check').checked;

      countEl.textContent = cart.length;

      if (cart.length === 0) {
        listEl.innerHTML = '<p style="color: #6c757d; font-size: 13px; text-align: center; margin-top: 30px;">購物車空空如也</p>';
        totalEl.textContent = 'NT$ 0';
        return;
      }

      let subtotal = cart.reduce((acc, curr) => acc + curr.price, 0);
      let total = subtotal + (hasWarranty ? 50 : 0);

      listEl.innerHTML = cart.map((item, index) => `
        <div class="cart-item">
          <div>
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-price">NT$ ${item.price}</div>
          </div>
          <button class="cart-item-del" onclick="removeFromCart(${index})">✕</button>
        </div>
      `).join('');

      totalEl.textContent = `NT$ ${total}`;
    }

    // 4. 複製訂單並前往 Discord 結帳
    function copyAndGoDiscord() {
      if (cart.length === 0) {
        alert('請先將商品加入清單！');
        return;
      }

      const hasWarranty = document.getElementById('warranty-check').checked;
      let subtotal = cart.reduce((acc, curr) => acc + curr.price, 0);
      let total = subtotal + (hasWarranty ? 50 : 0);

      let orderText = `🛒 【Roblox 浣貓工作室】採購訂單\\n`;
      orderText += `---------------------------------------\\n`;
      cart.forEach((item, i) => {
        orderText += `${i + 1}. ${item.name} - NT$ ${item.price}\\n`;
      });
      if (hasWarranty) {
        orderText += `★ 加購服務：7 天售後保障 (+NT$ 50)\\n`;
      }
      orderText += `---------------------------------------\\n`;
      orderText += `💰 總計金額：NT$ ${total}\\n`;
      orderText += `老闆您好，我想要購買以上商品！`;

      navigator.clipboard.writeText(orderText).then(() => {
        alert('✅ 訂單內容已複製到剪貼簿！即將帶你前往 Discord 私訊結單。');
        window.open('https://discord.gg/wdrpVxyjTe', '_blank');
      }).catch(() => {
        window.open('https://discord.gg/wdrpVxyjTe', '_blank');
      });
    }

    // 分類篩選切換
    function filterCategory(cat, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      document.getElementById('sec-script').style.display = (cat === 'all' || cat === 'script') ? 'block' : 'none';
      document.getElementById('sec-account').style.display = (cat === 'all' || cat === 'account') ? 'block' : 'none';
      document.getElementById('sec-service').style.display = (cat === 'all' || cat === 'service') ? 'block' : 'none';
    }
  </script>
</body>
</html>
